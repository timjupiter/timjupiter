<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABSENSI SHIFT</title>

<style>
body{
    font-family:Arial,sans-serif;
    padding:20px;
}

.section{
    border:1px solid #ddd;
    background:#f9f9f9;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

.section h2{
    text-align:center;
    margin-top:0;
}

.desc{
    text-align:center;
    color:#666;
    font-size:14px;
    margin-top:-5px;
    margin-bottom:15px;
    font-style:italic;
}

.container{
    display:grid;
    gap:20px;
}

.box-wrapper{
    display:flex;
    flex-direction:column;
}

.label{
    font-weight:bold;
    text-align:center;
    margin-bottom:5px;
}

.box{
    border:1px solid #ddd;
    background:#f9f9f9;
    height:250px;
    display:flex;
    flex-direction:column;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
    padding:10px;
}

textarea{
    width:100%;
    height:100%;
    border:none;
    resize:none;
    background:none;
    white-space:pre-wrap;
    font-family:Arial;
}

button{
    width:100%;
    padding:8px;
    border:none;
    color:#fff;
    cursor:pointer;
    border-radius:5px;
    background:linear-gradient(45deg,#007bff,#0056b3);
}

button:hover{
    transform:scale(1.03);
}

.refresh-btn{
    display:block;
    width:220px;
    margin:0 auto 20px;
    background:linear-gradient(45deg,#28a745,#218838);
}

.feedback{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#4CAF50;
    color:#fff;
    padding:10px;
    border-radius:5px;
    display:none;
}

@media(min-width:768px){
.container{grid-template-columns:repeat(3,1fr);}
}

@media(max-width:767px){
.container{grid-template-columns:1fr;}
}
</style>

</head>

<body>

<button class="refresh-btn" onclick="fetchData()">🔄 Refresh Data</button>

<!-- EVO -->
<div class="section" id="full_personil">
<h2>Team EVO</h2>
<p class="desc">Kirim ke grup EVO-EXO, Jupiter OPS, NOC All Operator & OPS GCS (PSCF-BSCF)</p>
<div class="container"></div>
</div>

<!-- EVO TANPA OPERATOR -->
<div class="section" id="no_full_personil">
<h2>Team EVO (Tanpa Operator)</h2>
<p class="desc">Kirim ke Shift On Duty ITD - Operation & Telegram grup Berkah</p>
<div class="container"></div>
</div>

<!-- EXO -->
<div class="section" id="team_exo">
<h2>Team EXO</h2>
<div class="container"></div>
</div>

<!-- EXO TANPA OPERATOR -->
<div class="section" id="team_exo_no_operator">
<h2>Team EXO (Tanpa Operator)</h2>
<div class="container"></div>
</div>

<!-- ITSM -->
<div class="section" id="monitoring">
<h2>Team ITSM</h2>
<p class="desc">Jupiter & H2H</p>
<div class="container"></div>
</div>

<div id="feedback" class="feedback">Copied</div>

<script>

function copyToClipboard(id){
    const el=document.getElementById(id);
    el.select();
    document.execCommand("copy");

    const fb=document.getElementById("feedback");
    fb.style.display="block";
    setTimeout(()=>fb.style.display="none",1000);
}

async function fetchData(){

const apiURL="https://script.google.com/macros/s/AKfycbzyQK3y9gpzfmXkcfaKaz9MAh7n-4kHROJdKNvfG1xzG2g9LTk4PNbWr1LDl4H64t7M/exec";

document.querySelectorAll(".container").forEach(c=>c.innerHTML="Loading...");

try{

const res=await fetch(apiURL);
const json=await res.json();

const labels={
E59:"Shift 1",O59:"Shift 2",Y59:"Shift 3",
E60:"Shift 1",O60:"Shift 2",Y60:"Shift 3",
E62:"Shift 1",O62:"Shift 2",Y62:"Shift 3",
E63:"Shift 1",O63:"Shift 2",Y63:"Shift 3",
E61:"Shift 1",O61:"Shift 2",Y61:"Shift 3"
};

function box(cell,container){

const w=document.createElement("div");
w.className="box-wrapper";

const l=document.createElement("div");
l.className="label";
l.innerText=labels[cell]||cell;

const b=document.createElement("div");
b.className="box";

const t=document.createElement("textarea");
t.id=cell+"_t";
t.readOnly=true;
t.textContent=json[cell]||"No Data";

const btn=document.createElement("button");
btn.innerText="Copy";
btn.onclick=()=>copyToClipboard(t.id);

b.appendChild(t);
b.appendChild(btn);

w.appendChild(l);
w.appendChild(b);
container.appendChild(w);

}

const evo=document.querySelector("#full_personil .container");
const evoNo=document.querySelector("#no_full_personil .container");
const exo=document.querySelector("#team_exo .container");
const exoNo=document.querySelector("#team_exo_no_operator .container");
const itsm=document.querySelector("#monitoring .container");

evo.innerHTML="";
evoNo.innerHTML="";
exo.innerHTML="";
exoNo.innerHTML="";
itsm.innerHTML="";

["E59","O59","Y59"].forEach(c=>box(c,evo));
["E60","O60","Y60"].forEach(c=>box(c,evoNo));

["E62","O62","Y62"].forEach(c=>box(c,exo));
["E63","O63","Y63"].forEach(c=>box(c,exoNo));

["E61","O61","Y61"].forEach(c=>box(c,itsm));

}catch(err){
console.log(err);
document.querySelectorAll(".container").forEach(c=>c.innerHTML="Failed load data");
}

}

fetchData();
setInterval(fetchData,3600000);

</script>

</body>
</html>
